<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Clean Modern Emblem -->
  <g transform="translate(10, 10)">
    <rect width="72" height="72" rx="18" fill="url(#blueGrad)" />
    <!-- Monogram TCC -->
    <path d="M 22 24 L 50 24 M 36 24 L 36 50" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 22 36 C 18 40 18 46 22 50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 50 36 C 54 40 54 46 50 50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Clean Typography -->
  <g transform="translate(98, 20)">
    <text x="0" y="30" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="25" fill="#0f172a" letter-spacing="1.5">
      TAPADIA <tspan fill="url(#goldGrad)">CITY</tspan> CENTRE
    </text>
    <text x="2" y="52" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748b" letter-spacing="2.5">
      AMRAVATI • WESTERN VIDARBHA
    </text>
  </g>
</svg>